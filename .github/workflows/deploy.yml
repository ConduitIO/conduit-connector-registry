name: Deploy

# S6 (ws4-plan.md §2 S6, amended AC 4.10): build-free publication of the
# signed index. This is the decoupling that fixes the 21 Aug outage mechanism —
# the old deploy.yml built the stale `web/` copy and a UI a11y/lint failure
# could block a signed index from reaching users. There is NO UI build in this
# workflow: it publishes index/index.json to GitHub Pages (the repo's Pages
# project, served at https://index.conduitdata.io/index.json) and then notifies
# conduit-registry-ui, which owns the human-facing site at
# https://registry.conduitdata.io (its own deploy workflow, S6 PR B).
#
# The canonical index URL https://index.conduitdata.io/index.json never moves.
# The CLI's compiled-in default (registry.DefaultIndexURL,
# https://registry.conduitdata.io/index.json) also never moves: it is served by
# the UI repo's build output (dist/index.json, a byte-copy of the verified
# index) once S6 PR B deploys, and by this Pages project in the interim — the
# same signed bytes either way.
#
# Triggers:
#   (a) push to main touching index/** — an index-content merge;
#   (b) .github/workflows/deploy.yml itself (so this workflow's first merge
#       publishes immediately);
#   (c) workflow_dispatch — index-sign.yml dispatches this after every re-sign
#       (GITHUB_TOKEN pushes do not fire workflows, so the ceremony dispatches
#       explicitly; its "Commit + push" step is the primary trigger in
#       practice). Manual dispatch is also available.
#
# There is deliberately NO schedule: the old daily cron existed to refresh
# Scarf stats in the web build, which no longer exists here. The daily rebuild
# cadence moved to the UI repo's deploy workflow (its cron, AC 4.11).
on:
  push:
    branches: [main]
    paths:
      - 'index/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Structural gate before anything is uploaded — see
      # .github/scripts/index-gate.py for what it asserts and why it is
      # structural-only (crypto lives in the ceremony + the UI's S2 build).
      - name: Structural gate on the signed index
        run: python3 .github/scripts/index-gate.py

      # The Pages artifact is exactly the index file; it is served at
      # /index.json on the project's custom domain (index.conduitdata.io).
      - name: Upload the signed index as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: index/index.json

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Byte-compare the LIVE canonical URL against exactly what this run
      # published — catches a broken deploy or a stale CDN cache (the same
      # post-deploy smoke the old web deploy ran, now against the index host).
      # Fail-closed by design: if index.conduitdata.io does not resolve (DNS
      # record / Pages custom domain not yet configured — see the S6 PR body)
      # this step fails loudly rather than passing a publish that nobody can
      # reach at the canonical URL. Short retry loop for Pages/CDN settling on
      # a freshly-deployed artifact; a real mismatch does not self-heal.
      - name: Post-deploy smoke (byte-compare the live index)
        run: |
          set -euo pipefail
          local_sha=$(sha256sum index/index.json | awk '{print $1}')
          echo "local:  $local_sha  index/index.json"
          live_sha=""
          for attempt in 1 2 3; do
            if live_sha=$(curl --fail --silent --show-error --max-time 30 \
              https://index.conduitdata.io/index.json | sha256sum | awk '{print $1}'); then
              break
            fi
            echo "fetch attempt $attempt failed — retrying in 5s"
            sleep 5
          done
          if [ -z "$live_sha" ]; then
            echo "::error::could not fetch https://index.conduitdata.io/index.json — is the" >&2
            echo "::error::DNS record (CNAME -> conduitio.github.io) and the Pages custom domain" >&2
            echo "::error::configured? See the S6 PR body for the exact steps." >&2
            exit 1
          fi
          echo "live:   $live_sha  https://index.conduitdata.io/index.json"
          if [ "$local_sha" != "$live_sha" ]; then
            echo "::error::live index bytes do NOT match index/index.json — stale CDN or broken deploy" >&2
            exit 1
          fi
          echo "smoke: PASSED — index.conduitdata.io/index.json byte-matches index/index.json"

  notify-ui:
    needs: [deploy, smoke]
    runs-on: ubuntu-latest
    # Job-level env so the step's `if:` can read it (step-level env is not
    # available to the step's own condition).
    env:
      DISPATCH_TOKEN: ${{ secrets.REGISTRY_UI_DISPATCH_TOKEN }}
    steps:
      # AC 4.11: rebuild the UI on every re-sign. The UI's deploy workflow
      # listens for repository_dispatch(registry-index-updated). A repo-scoped
      # GITHUB_TOKEN cannot dispatch to another repository, so this uses a PAT
      # (contents: write on ConduitIO) stored as REGISTRY_UI_DISPATCH_TOKEN in
      # this repo's secrets; until it is provisioned the step is skipped and
      # the UI's daily cron is the rebuild backstop. Provision: a fine-grained
      # PAT on ConduitIO/conduit-registry-ui with Contents: Read, or a classic
      # PAT with the `repo` scope. Manual fallback, documented in the S6 PR
      # body: gh workflow run deploy.yml --repo ConduitIO/conduit-registry-ui
      - name: Notify conduit-registry-ui of a fresh index
        if: env.DISPATCH_TOKEN != ''
        run: |
          gh api -X POST repos/ConduitIO/conduit-registry-ui/dispatches \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -f event_type=registry-index-updated
          echo "dispatched repository_dispatch(registry-index-updated) to conduit-registry-ui"
