name: index-sign

# Root-signs index/index.json with the ceremony root key and commits the signed
# envelope back to main. This is what makes the index verifiable by the shipped
# client (index.Verify) and the publish Action's register step.
#
# Root-key uses stay workflow_dispatch ONLY: every use of the root key is a
# deliberate, gated action (environment: registry-signing, required reviewer =
# maintainer). A manual dispatch's signed-index commit can never re-trigger
# this workflow — no loop (pushes made with GITHUB_TOKEN don't fire Actions).
#
# WHY THERE IS NO SCHEDULED HEARTBEAT HERE, AND WHY `freshness` CANNOT SIGN
# THE PUBLISHED INDEX.
#
# An earlier revision of this file added a daily `schedule:` that signed
# role=freshness. It was removed after being run for real on 2026-08-21 to
# clear a live outage. What happened:
#
#   sign job:   success  -> committed index version 9, signatures: ['freshness']
#   deploy job: FAILURE  -> [registry-web] BUILD FAILED [ERR_INDEX_INTEGRITY]:
#                           index has no structurally valid `root`-role
#                           signature entry - refusing to render from it
#
# The repo got a fresh index; the CDN kept serving the 18-day-old one. A
# nightly heartbeat built this way would have gone GREEN on this job and RED on
# deploy every night, leaving the published index frozen - the exact failure it
# existed to prevent, with a passing checkmark beside it.
#
# The cause is not a bug in either job. Both signature roles sign the SAME
# canonicalized payload, so refreshing index.timestamp invalidates the previous
# root signature: a freshness re-sign REPLACES the root signature rather than
# adding to it. And an index carrying only a freshness signature is rejected by
# both consumers, for independent reasons:
#
#   * A first-time client cannot verify it. pkg/registry/index/verify.go
#     accepts a freshness signature only when the client's persisted
#     lastVerifiedContentHash matches the payload's content subtree. A fresh
#     install has no such hash, and verify.go's own doc says it outright:
#     "a freshness-only index can never be the FIRST index a client ever
#     accepts, by construction".
#   * The site build refuses it - web/src/lib/verifyIndex.ts requires a
#     structurally valid root-role entry before it will render anything.
#
# So the PUBLISHED index must always carry a root signature. Freshness is
# usable only for a consumer that has already root-verified this content, which
# the published artifact's audience is not.
#
# The liveness problem is therefore solved by index-staleness-alarm.yml, which
# fetches the published index like a real client and fails loudly at 72h -
# roughly four days before the shipped client's 168h refusal
# (pkg/registry/index/freeze.go DefaultMaxStaleness). The alarm is the trigger;
# a human dispatches a role=root re-sign when it fires.
#
# Be accurate about the cost, because the comparison below depends on it: that
# is TWO actions (dispatch, then approve the Environment gate), not one, and
# because nothing re-signs automatically the alarm fires on a fixed ~3-day
# cadence rather than only when something is wrong — see the alarm's own header.
# So this is roughly 120 dispatch-and-approve cycles a year. It still beats the
# scheduled alternative, which would have parked a job for approval every single
# night (365 approvals) and, as the section below explains, could not have
# signed anything usable anyway.
#
# Doing this properly - a low-privilege key that can extend liveness unattended
# - needs a detached, freshness-signed liveness document separate from the
# index, plus client support for it. That is filed for v0.21. Do not reach for
# role=freshness on the published index again without reading that design; this
# comment exists because the reason is not visible from the code.
#
# WHY A SCHEDULE WOULD NOT HAVE HELPED EVEN IF FRESHNESS WORKED, kept because
# it constrains the v0.21 design: the signing keys are Environment secrets
# scoped to `registry-signing`, which carries a required-reviewers protection
# rule (see root-keygen.yml). GitHub's environment protection applies to every
# job referencing the environment REGARDLESS OF TRIGGER — so a scheduled run
# would park in "Waiting" for manual approval exactly like a dispatch does. A
# nightly schedule would therefore not have reduced maintainer involvement; it
# would have raised it, from "dispatch when the alarm fires" to "approve a
# parked job every night".
#
# Any future unattended design has to solve THAT, not just the signature-role
# question — which is why the v0.21 plan is a detached liveness document signed
# by a low-privilege key in its own ungated environment, rather than another
# schedule pointed at this job.
#
# Role semantics: a first-time client can only verify a ROOT signature, so
# every re-sign of the published index — content change or timestamp-only —
# uses role=root.

on:
  workflow_dispatch:
    inputs:
      role:
        # Nothing reads this value — the signing step hard-codes ROLE: root.
        # It exists so GitHub's own choice validation rejects
        # `gh workflow run -f role=freshness` at the API boundary, before any
        # job starts. A dropped input would silently accept that flag instead.
        description: 'signature role (root is the only valid role; see the header)'
        type: choice
        # `freshness` is deliberately NOT an option. It has no legitimate use
        # against index/index.json: it replaces the root signature, which a
        # first-time client cannot verify and the site build refuses outright.
        # A comment alone is not a guard under incident pressure — and the
        # alarm's own issue used to recommend exactly this. If a detached
        # liveness document ever ships (v0.21), it gets its own workflow.
        options: [root]
        default: root
      reset-to-empty:
        description: 'BOOTSTRAP: overwrite the payload with an empty connectors[] seed before signing (use once, to replace the placeholder index)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # dispatch deploy.yml after committing the re-signed index

concurrency:
  # Two dispatches (say, an alarm-driven re-sign and a post-register content
  # sign) must never race into concurrent pushes to main, which would risk two
  # indexes at the same version. Queue rather than cancel.
  #
  # Not a durability guarantee: GitHub holds at most ONE pending run per group,
  # so a third dispatch cancels the pending second. That is harmless here only
  # because every run re-assembles from index/connectors and re-timestamps, so
  # the surviving run subsumes whatever the cancelled one would have done. Do
  # not rely on this group to serialize work that is NOT idempotent.
  group: index-sign
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    environment: registry-signing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build the signer
        run: go build -o /tmp/index-sign ./cmd/index-sign

      - name: Bootstrap — reset payload to an empty seed
        if: ${{ inputs.reset-to-empty }}
        run: |
          set -euo pipefail
          # This input existed to bootstrap the placeholder index before
          # registry.conduitdata.io was live. That has since happened — the
          # served index is past version 1 with real connectors in it — so
          # ticking this box now is destructive, not a bootstrap: it would wipe
          # connectors[] and roll the served version backward.
          #
          # Nothing downstream would catch it. deploy.yml refuses a freshness
          # re-sign, but an empty index carrying a valid ROOT signature is
          # indistinguishable from a legitimate one to every check in the deploy
          # path (web/src/lib/verifyIndex.ts checks schema version, root-entry
          # structure and staleness — there is no monotonicity or rollback
          # guard anywhere). It would deploy, and every client with a persisted
          # version would break.
          #
          # So the guard is here: refuse unless the current index really is an
          # un-bootstrapped v1. The alarm's issue sends responders to this
          # dispatch form under time pressure, and this checkbox sits one line
          # from the role they came to set.
          # Compared in Python, not in `[ ... ]`. A shell numeric test inside an
          # `if` condition suppresses errexit, so `[ "$CURRENT" -gt 1 ]` against
          # a non-integer version (10.0, "v10", null, true) prints "integer
          # expression expected", returns 2, and takes the FALSE branch — the
          # guard would wipe the index and exit 0. That is the exact fail-open
          # this guard exists to prevent, and its premise is that the producer
          # is not to be trusted at this moment, so every non-integer shape must
          # refuse rather than fall through.
          if ! python3 -c "
          import json, sys
          v = json.load(open('index/index.json'))['payload']['index']['version']
          # bool is a subclass of int in Python; True must not read as 1.
          sys.exit(0 if isinstance(v, int) and not isinstance(v, bool) and v <= 1 else 1)
          "; then
            echo "::error::reset-to-empty refused: index/index.json is not an un-bootstrapped version 1 (it is published, its version is not an integer, or it could not be read). This would roll the served index back and drop every connector. Bootstrap is a one-time operation and it has already run." >&2
            exit 1
          fi
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"schemaVersion":1,"index":{"version":1,"timestamp":"%s"},"connectors":[]}\n' "$TS" > index/index.json
          echo "reset index/index.json to empty seed (timestamp $TS)"

      - name: Assemble + root-sign the index
        # FRESHNESS_SIGNING_KEY is deliberately NOT in this env block. Root is
        # the only dispatchable role (see the `role` input), so injecting the
        # freshness key here would put key material the workflow cannot legally
        # use into the signing step's environment — and would leave re-enabling
        # freshness a one-token edit to the `options:` list. Rebuilding the
        # freshness path means rebuilding it deliberately, and re-reading the
        # header that explains why it breaks the published index.
        env:
          ROOT_SIGNING_KEY: ${{ secrets.ROOT_SIGNING_KEY }}
          ROLE: root
          RESET: ${{ inputs.reset-to-empty }}
        run: |
          set -euo pipefail
          KEY="$ROOT_SIGNING_KEY"; KEYENV=ROOT_SIGNING_KEY
          if [ -z "$KEY" ]; then
            # Fail loudly, never silently: an empty key here (missing secret,
            # environment misconfigured, or the required-reviewers gate
            # somehow bypassed) must surface as a red X, not a quiet no-op —
            # that silence is exactly how the index went 18 days stale with
            # nobody noticing.
            echo "::error::signing key for role=$ROLE is empty in the registry-signing Environment" >&2
            exit 1
          fi
          # index-sign reads the key from the named env var (never an arg/log).
          ARGS=(-in index/index.json -out index/index.json -role "$ROLE" -key-env "$KEYENV")
          if [ "$RESET" != "true" ]; then
            # Rebuild payload.connectors[] AND payload.processors[] from the
            # per-entry source files the publish Action's register PRs add
            # (index/connectors/*.json, index/processors/*.json), bumping
            # index.version monotonically. processors[] is omitted entirely when
            # index/processors has no files, keeping a connector-only index
            # byte-identical to the pre-processor schema. reset-to-empty skips
            # this and signs the empty seed the bootstrap step wrote.
            ARGS+=(-assemble-from index/connectors -assemble-processors-from index/processors -timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)")
          fi
          /tmp/index-sign "${ARGS[@]}"

      - name: Commit + push the signed index (if changed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- index/index.json; then
            # Not reachable on the remediation path this workflow exists for:
            # on the -assemble-from path (which every non-reset run takes)
            # cmd/index-sign/main.go bumps index.version, and that same path
            # always passes a fresh -timestamp, so a re-sign always moves the
            # file. Kept as an honest no-op for the reset-to-empty case,
            # where signing an already-identical seed legitimately changes nothing.
            echo "index/index.json unchanged after signing — nothing to commit (deterministic ed25519 over an unchanged payload)."
            exit 0
          fi
          git config user.name "conduit-registry-signer[bot]"
          git config user.email "registry-signer@conduitdata.io"
          git add index/index.json
          git commit -m "chore(index): root-sign index/index.json"
          git push origin HEAD:main
          # GitHub does NOT trigger workflows for pushes made with GITHUB_TOKEN
          # (loop prevention), so deploy.yml won't fire on this commit — dispatch
          # it explicitly so the re-signed index actually gets served.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "dispatched deploy.yml for the re-signed index"

      - name: Job summary
        env:
          RESET: ${{ inputs.reset-to-empty }}
        run: |
          {
            echo "## index signed"
            echo ""
            echo "- role: \`root\`"
            echo "- reset-to-empty: \`${RESET}\`"
            echo "- connectors: \`$(python3 -c "import json;print(len(json.load(open('index/index.json'))['payload']['connectors']))")\`"
            echo "- processors: \`$(python3 -c "import json;print(len(json.load(open('index/index.json'))['payload'].get('processors',[])))")\`"
            echo ""
            echo "Deploy (\`deploy.yml\`) serves it at https://registry.conduitdata.io/index.json."
          } >> "$GITHUB_STEP_SUMMARY"
