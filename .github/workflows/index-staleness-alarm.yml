name: index-staleness-alarm

# Independent, secret-free detector for exactly the class of outage that
# caused `conduit connectors install` to fail for every user for 17 days
# (index/index.json's payload.index.timestamp aged past the shipped client's
# 7-day DefaultMaxStaleness — pkg/registry/index/freeze.go in ConduitIO/conduit
# — with nobody noticing until a user hit it).
#
# This job does NOT sign anything and needs no secret: it fetches the
# PUBLISHED index over plain HTTPS, the same way any `conduit` install would,
# and checks its age against a threshold BELOW the client's 7-day window —
# so a maintainer finds out days before any user does, regardless of whether
# anyone has re-signed recently.
#
# THIS ALARM IS THE TRIGGER, not a backstop for an automatic one. There is no
# scheduled re-sign: index-sign.yml is workflow_dispatch-only (see its header
# for why a freshness heartbeat cannot work against the published index), so
# the published timestamp only moves when a human dispatches role=root. This
# job exists to tell them when to.
#
# maxAgeHours = 72h (3 days): comfortably inside the client's 168h (7-day)
# refusal, leaving ~4 days between this alarm firing and users seeing
# registry.index_stale.
#
# OPERATIONAL RISK, stated so it is not rediscovered the hard way: with no
# automatic re-sign, those ~4 days are the entire margin, a filed GitHub issue
# is the only notification channel, and this project has one maintainer. A
# holiday, illness, or a stretch of not reading notifications spends the margin
# silently. The v0.21 detached-liveness-document design is what removes the
# human from this path; until then this window is accepted, not solved.
#
# 12:30 UTC: after deploy.yml's daily Scarf-stats cron (06:17 UTC) has run and
# the CDN in front of registry.conduitdata.io has settled — checking too soon
# after a legitimate re-sign risks a false alarm from propagation lag rather
# than a real staleness problem.

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  INDEX_URL: https://registry.conduitdata.io/index.json
  MAX_AGE_HOURS: '72'

jobs:
  check-staleness:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the published index
        id: fetch
        run: |
          set -euo pipefail
          # --fail: a non-2xx response (e.g. the CDN itself is down) is a
          # visible failure, not an empty 200-with-error-page body.
          if ! curl --fail --silent --show-error --retry 3 --retry-delay 5 \
              -o /tmp/index.json "$INDEX_URL"; then
            echo "::error::could not fetch $INDEX_URL — the registry endpoint itself may be down"
            exit 1
          fi

      - name: Check payload.index.timestamp age
        id: check
        run: |
          set -euo pipefail
          python3 - "$MAX_AGE_HOURS" <<'PYEOF'
          import json
          import os
          import sys
          from datetime import datetime, timezone

          max_age_hours = float(sys.argv[1])

          def emit(**kv):
              # GITHUB_OUTPUT is read from the environment, not shell-interpolated
              # into this heredoc, so the path can't be tampered with by anything
              # this script itself prints or computes.
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  for k, v in kv.items():
                      out.write(f"{k}={v}\n")

          # A malformed index must be reported AS malformed. Letting a parse
          # error crash this step leaves the outputs unwritten, and the
          # issue-filing step downstream then reports "index.timestamp
          # (unknown) is unknownh old" — pointing the responder at a re-sign
          # when the actual problem is a corrupt or schema-changed document.
          # Fails closed either way; this is about telling the truth in the
          # issue, not about safety.
          try:
              with open("/tmp/index.json") as f:
                  doc = json.load(f)

              # This is an unverified read (no signature check — this job carries
              # no key material) purely to read a timestamp for a liveness alarm.
              # It must never be used to authorize any install/content decision;
              # that trust boundary belongs solely to pkg/registry/index.Verify.
              ts_raw = doc["payload"]["index"]["timestamp"]
              ts = datetime.strptime(ts_raw, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)
          except (json.JSONDecodeError, KeyError, TypeError, ValueError, OSError) as err:
              print(f"MALFORMED: could not read index.timestamp: {type(err).__name__}: {err}")
              emit(malformed="true", age_hours="unknown", timestamp="unknown", stale="true")
              sys.exit(1)

          now = datetime.now(timezone.utc)
          age_hours = (now - ts).total_seconds() / 3600.0

          # A timestamp in the future is a clock-skew or a bad sign, not
          # freshness. Report it rather than silently treating it as healthy.
          if age_hours < 0:
              print(f"MALFORMED: index.timestamp {ts_raw} is in the future ({age_hours:.1f}h)")
              emit(malformed="true", age_hours=f"{age_hours:.1f}", timestamp=ts_raw, stale="true")
              sys.exit(1)

          print(f"index.timestamp = {ts_raw}")
          print(f"age = {age_hours:.1f}h (alarm threshold = {max_age_hours:.0f}h, "
                f"client refuses at 168h)")

          emit(malformed="false", age_hours=f"{age_hours:.1f}", timestamp=ts_raw,
               stale="true" if age_hours > max_age_hours else "false")

          if age_hours > max_age_hours:
              sys.exit(1)
          PYEOF

      - name: Open/update an issue on staleness or fetch failure
        if: failure()
        uses: actions/github-script@v7
        env:
          AGE_HOURS: ${{ steps.check.outputs.age_hours }}
          INDEX_TS: ${{ steps.check.outputs.timestamp }}
          MALFORMED: ${{ steps.check.outputs.malformed }}
          MAX_AGE_HOURS: ${{ env.MAX_AGE_HOURS }}
          INDEX_URL: ${{ env.INDEX_URL }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
        with:
          script: |
            const fetchFailed = process.env.FETCH_OUTCOME !== 'success';
            const malformed = process.env.MALFORMED === 'true';
            const title = fetchFailed
              ? 'registry index endpoint is unreachable'
              : malformed
                ? 'registry index is unreadable — cannot determine freshness'
                : 'registry index is going stale — install will start failing';

            let body;
            if (malformed && !fetchFailed) {
              body = [
                `Fetched ${process.env.INDEX_URL} successfully, but could not read`,
                '`payload.index.timestamp` from it — the document is malformed, its schema changed,',
                'or its timestamp is in the future (clock skew or a bad sign).',
                '',
                'This is NOT the ordinary "nobody re-signed recently" case, so do not start by',
                'dispatching a re-sign. Look at the served document first: a re-sign over a broken',
                'payload would publish the same breakage with a fresher timestamp.',
                '',
                'Check the run log for the exact parse error, then compare the served bytes against',
                '`index/index.json` on `main`.',
                '',
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n');
            } else if (fetchFailed) {
              body = [
                `Could not fetch ${process.env.INDEX_URL} — the registry endpoint itself may be down`,
                'or unreachable, which is at least as urgent as a stale-but-served index: every',
                '`conduit connectors install` is failing right now.',
                '',
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n');
            } else {
              const ageHours = process.env.AGE_HOURS || 'unknown';
              const indexTs = process.env.INDEX_TS || 'unknown';
              const maxAgeHours = process.env.MAX_AGE_HOURS;
              body = [
                `\`index/index.json\`'s `+"`payload.index.timestamp`"+` (${indexTs}) is ${ageHours}h old,`,
                `past this alarm's ${maxAgeHours}h threshold.`,
                '',
                'The shipped `conduit` client refuses the index outright at 168h (7 days) — ' +
                '`registry.index_stale` — and every `conduit connectors install` starts failing.',
                '',
                'Cause: there is no automatic re-sign. `index-sign.yml` is ' +
                '`workflow_dispatch`-only by design, so the published index only gets a fresh ' +
                'timestamp when a human dispatches one. Nobody has in over ' +
                `${maxAgeHours}h.`,
                '',
                'Fix: dispatch `index-sign.yml` with **`role: root`** and approve it at the ' +
                '`registry-signing` Environment gate.',
                '',
                'Use `role: root` even though nothing about the content changed. Do NOT use ' +
                '`role: freshness` against the published index: both roles sign the same ' +
                'canonicalized payload, so a freshness re-sign REPLACES the root signature rather ' +
                'than adding to it, and a freshness-only index is refused by a first-time client ' +
                '(no persisted lastVerifiedContentHash to match) and by the site build ' +
                '(ERR_INDEX_INTEGRITY, no root-role entry) — the deploy fails and the CDN keeps ' +
                'serving the stale index. That happened on 2026-08-21; see `index-sign.yml`\'s ' +
                'header comment.',
                '',
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n');
            }

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'index-staleness',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still failing as of this run.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['index-staleness'],
              });
            }

      - name: Close the staleness issue once resolved
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'index-staleness',
            });
            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Resolved as of this run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
