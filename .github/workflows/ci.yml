name: CI

# S6 (ws4-plan.md §2 S6): the web UI CI moved out of this repo with the web/
# directory — the full build/lint/a11y gate now lives in
# ConduitIO/conduit-registry-ui (its ci.yml). What remains HERE is what THIS
# repo publishes: the signed index (index/), served build-free at
# index.conduitdata.io/index.json by deploy.yml. This workflow runs the
# structural index gate on every index change.
#
# The gate is structural only (parse, schemaVersion, root-role signature
# entry, assemblability) — no key material, no crypto. The signing ceremony
# (index-sign.yml) and the round-trip tests in cmd/index-sign (go-ci.yml)
# cover the crypto; a full signature-verification gate is the UI repo's S2
# build, which verifies the published bytes with the conduit CLI's own
# verifier + compiled-in trust anchors.
on:
  pull_request:
    paths:
      - 'index/**'
      - '.github/scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main]
    paths:
      - 'index/**'
      - '.github/scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

jobs:
  index-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Structural gate on the signed index
        run: python3 .github/scripts/index-gate.py

      # B1 regression check (found in adversarial review): upload-pages-artifact
      # chdir's into the artifact path and archives '.', so a single-file path
      # makes every deploy fail. Reproduce the chdir here (tar refuses to chdir
      # into a file, exactly like the action) so a regression of the staging
      # fails CI instead of the post-merge deploy.
      - name: Verify the Pages artifact archives (tar-chdir reproduction)
        run: |
          set -euo pipefail
          mkdir -p .pages
          cp index/index.json .pages/index.json
          tar -cf /dev/null -C .pages .
