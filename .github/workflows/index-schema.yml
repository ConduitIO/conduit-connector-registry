name: index-schema

# Validates index/connectors/*.json, index/processors/*.json and
# index/index.json against index/index-schema.json, plus the trust and
# spec-name lints in index/ci/validate_entries.py. index-sign copies entry
# files into the signed index without checking them, so without this job a
# malformed entry would be signed and served. index-sign.yml runs the same
# validator before signing.
#
# No `paths:` filter, on purpose: the job must report on every pull request
# so it can be a required status check. A path-filtered workflow never reports
# on unrelated pull requests, and a required check that never reports blocks
# every merge. The job takes well under a minute.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # jsonschema only enforces `format` (uri, date-time) when its format
      # extras are installed; validate_entries.py refuses to run without them.
      - name: Install jsonschema
        run: python -m pip install --disable-pip-version-check -r index/ci/requirements.txt

      - name: Validator self-tests (every check can fail)
        run: python -m unittest discover -s index/ci -v

      - name: Validate
        run: python index/ci/validate_entries.py
